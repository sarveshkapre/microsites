name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - gallery
          - premium-product
          - editorial-scrolly
          - neon-cinematic
          - playful-micro
          - webgl-dom-sync
          - dataviz-scrolly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint -w ${{ matrix.workspace }}
      - name: Build
        run: npm run build -w ${{ matrix.workspace }}

  smoke:
    name: Smoke (dev servers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Smoke
        run: npm run smoke:ci

  pages:
    name: Pages build + bundle budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build static site
        run: node scripts/build-pages.mjs
      - name: Bundle budgets
        run: npm run check:bundles
